<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTS Star Ratings</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--fg:#1c1917;--mut:#78716c;--line:#e7e5e4;--star:#d97706;--off:#d6d3d1}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--fg:#f5f5f4;--mut:#a8a29e;--line:#44403c;--star:#f59e0b;--off:#57534e}}
*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;max-width:900px;margin:0 auto;padding:20px 16px}
h1{font-size:21px;margin:0 0 4px}p{color:var(--mut);margin:0 0 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.t{font-weight:600}.m{color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}audio{width:100%;height:36px;grid-column:1/-1}
.stars{display:flex;gap:2px}.stars button{all:unset;cursor:pointer;font-size:24px;line-height:1;color:var(--off);padding:2px}.stars button.on{color:var(--star)}
.stars button:focus-visible{outline:2px solid var(--star);border-radius:4px}
.bar{display:flex;gap:8px;margin:0 0 10px}.bar button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.fail{color:var(--mut);font-size:13px;margin:4px 0}
</style></head><body>
<h1>TTS star ratings</h1>
<p>Same sentence for every local clip, generated on the RX 6700 XT. gen = average of 3 warm runs; RTF = gen time ÷ audio length (below 1 is faster than real time). Click stars to rate; the list re-sorts.</p>
<div class="bar"><button id="exp">Export ratings</button><button id="clr">Clear ratings</button></div>
<div id="list"></div>

const list=document.getElementById('list');
const cards=CLIPS.map(c=>{const d=document.createElement('div');d.className='card';
 const m=c.warm_s!=null?`gen ${c.warm_s}s · audio ${c.audio_s}s · RTF ${c.rtf} · first run ${c.first_s}s · load ${c.load_s}s · ${c.device}`:c.device;

 const s=d.querySelector('.stars');
 for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent='★';b.setAttribute('aria-label',i+' star'+(i>1?'s':''));
  b.onclick=()=>{R[c.file]=R[c.file]===i?0:i;save();paint();};s.appendChild(b);}
 d._c=c;d._s=s;return d;});
function paint(){cards.forEach(d=>[...d._s.children].forEach((b,i)=>b.classList.toggle('on',i<(R[d._c.file]||0))));
