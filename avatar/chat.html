<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shiori Chat</title>
<style>
  /* transparent for OBS; ?bg=1e1e24 gives a dark background when viewing in a normal browser */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #chat { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 12px; }
  .msg { flex: none; background: rgba(0,0,0,.65); border-radius: 10px; padding: 8px 12px; color: #fff; font: 20px sans-serif; overflow-wrap: anywhere; }
  .msg b { margin-right: 8px; }
</style>
</head>
<body>
<div id="chat"></div>
<script>
  const bg = new URLSearchParams(location.search).get('bg');
  if (/^[0-9a-f]{6}$/i.test(bg)) document.body.style.background = '#' + bg;
  const box = document.getElementById('chat');
  const hue = name => [...name].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 0);   // same name, same colour
  new EventSource('/chat-events').onmessage = e => {
    const { user, text } = JSON.parse(e.data);
    const row = Object.assign(document.createElement('div'), { className: 'msg' });
    const who = Object.assign(document.createElement('b'), { textContent: user });   // textContent: chat is never HTML
    who.style.color = `hsl(${hue(user)} 80% 72%)`;
    row.append(who, text);
    box.append(row);
    while (box.children.length > 30) box.firstChild.remove();
  };
</script>
</body>
</html>
